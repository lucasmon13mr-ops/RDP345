name: Windows Cloud PC - Anydesk Melhorado

on:
  workflow_dispatch:

jobs:
  build:
    name: Iniciando Sistema Reforçado
    runs-on: windows-latest
    timeout-minutes: 10080
    env:
      PROCESSOR_COUNT: 8
      OPENGL: "1"
      GITHUB_PRESERVE_WORKFLOW: true
      MEMORY_GB: 128

    steps:
      - name: Baixar e Instalar Essenciais
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12

          if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
            iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))
          }

          choco install anydesk -y --ignore-checksums

          $anydeskPath = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"
          if (-not (Test-Path $anydeskPath)) {
            $anydeskPath = "C:\ProgramData\chocolatey\lib\anydesk\AnyDesk.exe"
          }

          Set-Content -Path "start.bat" -Value "@echo off`nstart `"`" `"$anydeskPath`""
          Write-Host "start.bat gerado em: $anydeskPath"

      - name: Iniciar AnyDesk
        run: |
          if (Test-Path "start.bat") {
            cmd /c start.bat
            Start-Sleep -Seconds 10
          } else {
            Write-Host "ERRO: Arquivo start.bat não encontrado — verifique o download."
            exit 1
          }

      - name: Monitoramento Contínuo e Reinício Automático
        run: |
          $restartCount = 0
          while ($true) {
            $anydesk = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            if (-not $anydesk -or $anydesk.HasExited) {
              $restartCount++
              Write-Host "[$((Get-Date).ToString('HH:mm:ss'))] AnyDesk offline — reiniciando (tentativa $restartCount)..."
              cmd /c start.bat
              Start-Sleep -Seconds 15
            } else {
              Write-Host "[$((Get-Date).ToString('HH:mm:ss'))] AnyDesk rodando — PID: $($anydesk.Id)"
            }
            Start-Sleep -Seconds 60
          }

      - name: Manter Sistema Ativo
        run: |
          Start-Sleep -Seconds 604800

      - name: Limpeza Segura
        if: always()
        run: |
          Stop-Process -Name "AnyDesk" -Force -ErrorAction SilentlyContinue
          Remove-Item start.bat -Force -ErrorAction SilentlyContinue
          Write-Host "Limpeza finalizada."
