name: ud PC - Anydesk Melhorado

on:
  workflow_dispatch:

jobs:
  build:
    name: Iniciando Sistema Reforçado
    runs-on: windows-latest
    timeout-minutes: 10080
    env:
      PROCESSOR_COUNT: 8
      OPENGL: "1"
      GITHUB_PRESERVE_WORKFLOW: true
      MEMORY_GB: 16

    steps:
      - name: Baixar AnyDesk Portátil e Iniciar
        run: |
          # Baixa direto o exe portátil — sem instalador, sem serviço
          Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "AnyDesk.exe" -UseBasicParsing
          
          # Define senha antes de iniciar
          $senha = "Acesso@2024"
          
          # Inicia em modo portátil
          Start-Process -FilePath ".\AnyDesk.exe" -ArgumentList "--portable" -WindowStyle Hidden
          Start-Sleep -Seconds 30

      - name: Pegar ID e Definir Senha
        run: |
          # Tenta pegar ID
          $id = ""
          for ($i = 0; $i -lt 10; $i++) {
            $id = .\AnyDesk.exe --get-id 2>&1
            Write-Host "Tentativa $($i+1): '$id'"
            if ($id -match "\d{6,}") { break }
            Start-Sleep -Seconds 15
          }

          # Define senha
          echo "Acesso@2024" | .\AnyDesk.exe --set-password 2>&1

          Write-Host "========================================="
          Write-Host "SEU ID ANYDESK: $id"
          Write-Host "SENHA: Acesso@2024"
          Write-Host "========================================="

      - name: Monitoramento Contínuo e Reinício Automático
        run: |
          $restartCount = 0
          while ($true) {
            $proc = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue
            if (-not $proc) {
              $restartCount++
              Write-Host "[$((Get-Date).ToString('HH:mm:ss'))] AnyDesk offline — reiniciando (tentativa $restartCount)..."
              Start-Process -FilePath ".\AnyDesk.exe" -ArgumentList "--portable" -WindowStyle Hidden
              Start-Sleep -Seconds 15
            } else {
              Write-Host "[$((Get-Date).ToString('HH:mm:ss'))] AnyDesk ativo — PID: $($proc.Id)"
            }
            Start-Sleep -Seconds 60
          }

      - name: Manter Sistema Ativo
        run: |
          Start-Sleep -Seconds 604800

      - name: Limpeza Segura
        if: always()
        run: |
          Stop-Process -Name "AnyDesk" -Force -ErrorAction SilentlyContinue
          Write-Host "Limpeza finalizada."
