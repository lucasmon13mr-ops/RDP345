name: Windows Cloud PC - Anydesk Melhorado

on:
  workflow_dispatch:

jobs:
  build:
    name: Iniciando Sistema Reforçado
    runs-on: windows-latest
    timeout-minutes: 10080
    env:
      PROCESSOR_COUNT: 8
      OPENGL: "1"
      GITHUB_PRESERVE_WORKFLOW: true
      MEMORY_GB: 16

    steps:
      - name: Ativar Remote Desktop e Definir Senha
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          $user = $env:USERNAME
          net user $user "Acesso@2024"

          Write-Host "========================================="
          Write-Host "USUÁRIO: $user"
          Write-Host "SENHA: Acesso@2024"
          Write-Host "========================================="

      - name: Instalar e Iniciar Ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_TOKEN }}
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip" -UseBasicParsing
          Expand-Archive -Path "ngrok.zip" -DestinationPath "." -Force

          .\ngrok.exe config add-authtoken $env:NGROK_TOKEN
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden

          $ready = $false
          for ($i = 0; $i -lt 10; $i++) {
            Start-Sleep -Seconds 8
            try {
              $tunnel = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
              if ($tunnel.tunnels.Count -gt 0) {
                $ready = $true
                break
              }
            } catch {
              Write-Host "Aguardando ngrok... tentativa $($i+1)"
            }
          }

          if (-not $ready) {
            Write-Host "ERRO: ngrok não subiu após 80 segundos."
            exit 1
          }

          $addr = $tunnel.tunnels[0].public_url -replace "tcp://", ""

          Write-Host "========================================="
          Write-Host "ENDEREÇO RDP: $addr"
          Write-Host "USUÁRIO: $env:USERNAME"
          Write-Host "SENHA: Acesso@2024"
          Write-Host "========================================="

      - name: Monitoramento Contínuo
        run: |
          while ($true) {
            $ngrok = Get-Process -Name "ngrok" -ErrorAction SilentlyContinue
            if (-not $ngrok) {
              Write-Host "[$((Get-Date).ToString('HH:mm:ss'))] ngrok offline — reiniciando..."
              Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389" -WindowStyle Hidden
              Start-Sleep -Seconds 30
              try {
                $tunnel = Invoke-RestMethod -Uri "http://localhost:4040/api/tunnels" -ErrorAction Stop
                $addr = $tunnel.tunnels[0].public_url -replace "tcp://", ""
                Write-Host "NOVO ENDEREÇO: $addr"
              } catch {
                Write-Host "API ainda não disponível — aguardando próximo ciclo."
              }
            } else {
              Write-Host "[$((Get-Date).ToString('HH:mm:ss'))] ngrok ativo."
            }
            Start-Sleep -Seconds 60
          }

      - name: Manter Sistema Ativo
        run: |
          Start-Sleep -Seconds 604800

      - name: Limpeza Segura
        if: always()
        run: |
          Stop-Process -Name "ngrok" -Force -ErrorAction SilentlyContinue
          Write-Host "Limpeza finalizada."
